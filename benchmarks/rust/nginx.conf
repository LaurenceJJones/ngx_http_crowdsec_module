load_module /etc/nginx/modules/libngx_http_crowdsec_module.so;

worker_processes 2;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type text/plain;
    access_log off;
    sendfile on;
    keepalive_timeout 65;

    crowdsec on;
    crowdsec_url http://mock:8080;
    crowdsec_api_key bench-bouncer-key;
    crowdsec_shm_size 512k;
    crowdsec_poll_interval 5;
    crowdsec_appsec on;
    crowdsec_appsec_url http://mock:7422/;
    crowdsec_appsec_failure_action passthrough;
    crowdsec_appsec_timeout 2000;
    crowdsec_bot_challenge off;

    server {
        listen 8080;
        location / {
            return 200 "ok\n";
        }
    }
}
