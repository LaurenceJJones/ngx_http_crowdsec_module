name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ github.token }}
      - name: Build and test module image
        run: docker build --pull --tag nginx-crowdsec:test --file docker/Dockerfile .
      - name: Run unit tests in builder image
        run: |
          docker build --pull --target rust-builder -t nginx-crowdsec:builder --file docker/Dockerfile .
          docker run --rm nginx-crowdsec:builder cargo check --tests --locked
      - name: Validate NGINX and decision enforcement
        env:
          NGINX_CROWDSEC_IMAGE: nginx-crowdsec:test
        run: ./scripts/test-bats-ci.sh
