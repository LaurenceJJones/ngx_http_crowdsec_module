name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ github.token }}
      - name: Build and test module image
        run: docker build --pull --tag nginx-crowdsec:test --file docker/Dockerfile .
      - name: Run unit tests in builder image
        run: |
          docker build --pull --target rust-builder -t nginx-crowdsec:builder --file docker/Dockerfile .
          docker run --rm nginx-crowdsec:builder cargo test --manifest-path tests/unit/Cargo.toml --locked
      - name: Run asynchronous verification regressions
        run: docker run --rm --add-host api.hcaptcha.com:127.0.0.1 nginx-crowdsec:builder python3 tests/regression.py --captcha-stall
      - name: Validate NGINX and decision enforcement
        env:
          NGINX_CROWDSEC_IMAGE: nginx-crowdsec:test
        run: ./scripts/test-bats-ci.sh

  ubuntu-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build Ubuntu noble nginx 1.24 module
        run: docker build --pull --file docker/Dockerfile.ubuntu-module --target builder --tag crowdsec-module:ubuntu-noble .
      - name: Export module
        run: |
          mkdir -p dist
          cid=$(docker create crowdsec-module:ubuntu-noble)
          docker cp "$cid:/build/target/release/libngx_http_crowdsec_module.so" \
            dist/ngx_http_crowdsec_module-ubuntu-noble-amd64.so
          docker rm "$cid"
          test -s dist/ngx_http_crowdsec_module-ubuntu-noble-amd64.so
          file dist/ngx_http_crowdsec_module-ubuntu-noble-amd64.so
