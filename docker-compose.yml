services:
  # CrowdSec LAPI
  crowdsec:
    image: crowdsecurity/crowdsec:v1.7.8
    container_name: crowdsec
    environment:
      # Disable agent scenarios (we only need LAPI for testing)
      COLLECTIONS: "crowdsecurity/nginx"
      DISABLE_AGENT: "true"
      DISABLE_ONLINE_API: "true"
      # Register a bouncer automatically
      BOUNCER_KEY_nginx: "test-bouncer-key-12345"
    volumes:
      - crowdsec_db:/var/lib/crowdsec/data
      - crowdsec_config:/etc/crowdsec
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crowdsec_net

  # NGINX with CrowdSec module
  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: nginx-crowdsec
    environment:
      CROWDSEC_BOUNCER_KEY: "test-bouncer-key-12345"
      # Captcha configuration (set in .env file)
      CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY:-}
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-}
      CAPTCHA_SIGNING_KEY: ${CAPTCHA_SIGNING_KEY:-}
    ports:
      - "9090:8080"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf.template:ro
    depends_on:
      crowdsec:
        condition: service_healthy
    networks:
      - crowdsec_net

volumes:
  crowdsec_db:
  crowdsec_config:

networks:
  crowdsec_net:
    driver: bridge
