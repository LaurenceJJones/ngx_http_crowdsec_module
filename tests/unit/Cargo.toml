[package]
name = "crowdsec-unit-tests"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.9", features = ["json"] }
hmac = "0.12"
sha2 = "0.10"
base64 = { version = "0.23", default-features = false, features = ["std"] }
rand = "0.10"

[lib]
path = "lib.rs"
