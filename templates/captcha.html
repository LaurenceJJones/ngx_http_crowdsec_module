<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Check - CrowdSec</title>
    <script src="{{captcha_script_url}}" async defer></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        .icon {
            font-size: 48px;
            margin-bottom: 20px;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 12px;
            font-weight: 600;
        }
        p {
            color: #666;
            margin-bottom: 24px;
            line-height: 1.6;
        }
        .error {
            background: #fee2e2;
            border: 1px solid #fca5a5;
            color: #dc2626;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: left;
        }
        .captcha-wrapper {
            display: flex;
            justify-content: center;
            margin: 24px 0;
            min-height: 78px;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            max-width: 200px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .info {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .info p {
            font-size: 12px;
            color: #999;
            margin-bottom: 8px;
        }
        .info .ip {
            font-family: 'SF Mono', Monaco, 'Courier New', monospace;
            background: #f5f5f5;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .footer {
            margin-top: 16px;
            font-size: 11px;
            color: #bbb;
        }
        .footer a {
            color: #999;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🛡️</div>
        <h1>Security Check</h1>
        <p>Please complete the challenge below to verify you're not a robot and continue to the site.</p>

        {{captcha_error}}

        <form method="POST" action="{{form_action}}">
            <div class="captcha-wrapper">
                <div class="{{captcha_div_class}}" data-sitekey="{{captcha_site_key}}"></div>
            </div>
            <button type="submit">Continue</button>
        </form>

        <div class="info">
            <p>Your IP address: <span class="ip">{{client_ip}}</span></p>
            <p>Requested: {{request_method}} {{request_uri}}</p>
        </div>

        <div class="footer">
            Protected by <a href="https://crowdsec.net" target="_blank" rel="noopener">CrowdSec</a>
        </div>
    </div>
</body>
</html>
