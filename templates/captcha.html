<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security verification</title>
    <script src="{{captcha_script_url}}" async defer></script>
    <style>
        :root {
            --bg: #eef1f6;
            --surface: #ffffff;
            --border: #d9e0ea;
            --text: #1c2b41;
            --muted: #5c6b7f;
            --accent: #1e4d8c;
            --accent-hover: #163a6a;
            --danger-bg: #fdf2f2;
            --danger-border: #f5c2c2;
            --danger-text: #9b1c1c;
            --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            line-height: 1.5;
        }
        .page { width: 100%; max-width: 440px; }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(28, 43, 65, 0.06);
            overflow: hidden;
        }
        .card-bar {
            height: 4px;
            background: linear-gradient(90deg, var(--accent), #2563eb);
        }
        .card-body { padding: 32px 28px 24px; text-align: center; }
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            color: var(--accent);
            font-size: 0.8125rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        h1 {
            font-size: 1.375rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }
        .lead {
            color: var(--muted);
            font-size: 0.9375rem;
            margin-bottom: 20px;
        }
        .error {
            background: var(--danger-bg);
            border: 1px solid var(--danger-border);
            color: var(--danger-text);
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 0.875rem;
            text-align: left;
        }
        .captcha-wrapper {
            display: flex;
            justify-content: center;
            margin: 8px 0 20px;
            min-height: 78px;
        }
        button {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9375rem;
            font-weight: 600;
            width: 100%;
            max-width: 240px;
            transition: background 0.15s ease;
        }
        button:hover { background: var(--accent-hover); }
        button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        .meta {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid var(--border);
            font-size: 0.8125rem;
            color: var(--muted);
            text-align: left;
        }
        .meta p + p { margin-top: 6px; }
        .meta code {
            font-family: var(--mono);
            font-size: 0.75rem;
            background: #f4f7fb;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .footer {
            margin-top: 14px;
            font-size: 0.75rem;
            color: #94a3b8;
        }
        .footer a { color: #64748b; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <main class="page">
        <article class="card">
            <div class="card-bar" aria-hidden="true"></div>
            <div class="card-body">
                <div class="brand" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                    <span>Verification required</span>
                </div>
                <h1>Security verification</h1>
                <p class="lead">Complete the check below to continue to this site.</p>

                {{captcha_error}}

                <form method="POST" action="{{form_action}}">
                    <div class="captcha-wrapper">
                        <div class="{{captcha_div_class}}" data-sitekey="{{captcha_site_key}}"></div>
                    </div>
                    <button type="submit">Continue</button>
                </form>

                <div class="meta">
                    <p>Client IP: <code>{{client_ip}}</code></p>
                    <p>Request: <code>{{request_method}} {{request_uri}}</code></p>
                </div>

                <p class="footer">Protected by <a href="https://crowdsec.net" target="_blank" rel="noopener noreferrer">CrowdSec</a></p>
            </div>
        </article>
    </main>
</body>
</html>
