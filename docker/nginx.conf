# Test NGINX configuration for CrowdSec module
load_module /etc/nginx/modules/libngx_http_crowdsec_module.so;

worker_processes 2;
error_log /var/log/nginx/error.log debug;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type text/html;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # CrowdSec configuration at http level
    crowdsec on;
    crowdsec_url http://crowdsec:8080;
    crowdsec_api_key ${CROWDSEC_BOUNCER_KEY};
    crowdsec_shm_size 512k;  # Shared memory size for decision cache
    crowdsec_appsec_url http://crowdsec:7422/;
    crowdsec_appsec on;
    crowdsec_appsec_failure_action passthrough;
    crowdsec_bot_challenge on;
    
    # Default ban template at http level (will be inherited by all locations)
    crowdsec_ban_template /etc/nginx/templates/default.html;

    # Captcha configuration at http level (inherited by all locations)
    # These use environment variables substituted at container start
    crowdsec_captcha_provider hcaptcha;
    crowdsec_captcha_site_key "${CAPTCHA_SITE_KEY}";
    crowdsec_captcha_secret_key "${CAPTCHA_SECRET_KEY}";
    crowdsec_captcha_signing_key "${CAPTCHA_SIGNING_KEY}";
    crowdsec_captcha_expiry 3600;
    crowdsec_captcha_fail_open on;
    crowdsec_captcha_bind_ip on;

    server {
        listen 8080;
        server_name localhost;

        # Root directory for serving files
        root /usr/share/nginx/html;

        # Enable CrowdSec for all locations by default

        location / {
            # Uses default template from http level
            try_files /index.html =404;
        }

        location /test {
            crowdsec off;
            try_files /test.html =404;
        }
        
        location /api {
            # Use JSON template for API endpoints
            crowdsec_ban_template /etc/nginx/templates/api.json;
            try_files /index.html =404;
        }
        
        location /simple {
            # Use simple template for testing alternative template
            crowdsec_ban_template /etc/nginx/templates/simple.html;
            try_files /index.html =404;
        }

        location /captcha-test {
            # Test location for captcha remediation
            # Add a captcha decision in CrowdSec to test:
            # docker exec crowdsec cscli decisions add --ip 172.18.0.1 --type captcha --duration 1h
            try_files /index.html =404;
        }

        location /captcha-custom {
            # Custom captcha template test
            crowdsec_captcha_template /etc/nginx/templates/captcha.html;
            try_files /index.html =404;
        }

    }
}
