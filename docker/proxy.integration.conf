events {
    worker_connections 64;
}

http {
    server {
        listen 8081;
        server_name localhost;

        location / {
            proxy_pass http://nginx:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        }
    }
}
