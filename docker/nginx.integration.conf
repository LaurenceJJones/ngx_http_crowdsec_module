# NGINX config for real CrowdSec integration tests (docker/compose.integration.yml).
load_module /etc/nginx/modules/libngx_http_crowdsec_module.so;

worker_processes 2;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type text/html;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    crowdsec on;
    crowdsec_url http://crowdsec:8080;
    crowdsec_api_key ${CROWDSEC_BOUNCER_KEY};
    crowdsec_fallback_remediation ban;
    crowdsec_poll_interval 2;
    crowdsec_shm_size 512k;

    crowdsec_appsec_url http://crowdsec:7422/;
    crowdsec_appsec on;
    crowdsec_appsec_failure_action passthrough;
    crowdsec_bot_challenge off;

    crowdsec_ban_template /etc/nginx/templates/default.html;

    crowdsec_captcha_provider hcaptcha;
    crowdsec_captcha_site_key "${CAPTCHA_SITE_KEY}";
    crowdsec_captcha_secret_key "${CAPTCHA_SECRET_KEY}";
    crowdsec_captcha_signing_key "${CAPTCHA_SIGNING_KEY}";
    crowdsec_captcha_expiry 3600;
    crowdsec_captcha_fail_open on;
    crowdsec_captcha_bind_ip on;
    crowdsec_captcha_template /etc/nginx/templates/captcha.html;

    crowdsec_trusted_proxies 172.16.0.0/12 10.0.0.0/8;
    crowdsec_real_ip_header X-Forwarded-For;

    server {
        listen 8080;
        server_name localhost;

        root /usr/share/nginx/html;

        location / {
            try_files /index.html =404;
        }

        location /test {
            crowdsec off;
            try_files /test.html =404;
        }

        location /health {
            crowdsec off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location /api {
            crowdsec_ban_template /etc/nginx/templates/api.json;
            try_files /index.html =404;
        }

        location /proxy/ {
            proxy_pass http://upstream:9000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /simple {
            crowdsec_ban_template /etc/nginx/templates/simple.html;
            try_files /index.html =404;
        }

        location /captcha-test {
            try_files /index.html =404;
        }

        location /captcha-custom {
            crowdsec_captcha_template /etc/nginx/templates/captcha.html;
            try_files /index.html =404;
        }

        location /crowdsec-metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 127.0.0.1;
            deny all;
            crowdsec off;
            crowdsec_metrics on;
        }
    }
}
