# NGINX target for CrowdSec hub AppSec tests (cscli hubtest --appsec).
#
# hubtest starts a local CrowdSec instance with:
#   LAPI  -> 127.0.0.1:8181
#   AppSec -> 127.0.0.1:4241  (--host default)
# Nuclei probes this server at http://127.0.0.1:7822/ (hub default --target).
load_module /etc/nginx/modules/libngx_http_crowdsec_module.so;

worker_processes 2;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type text/html;

    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;

    crowdsec on;
    crowdsec_url http://127.0.0.1:8181;
    crowdsec_api_key this_is_a_bad_password;
    crowdsec_poll_interval 60;
    crowdsec_shm_size 512k;

    crowdsec_appsec_url http://127.0.0.1:4241/;
    crowdsec_appsec on;
    crowdsec_appsec_always on;
    crowdsec_appsec_failure_action passthrough;
    crowdsec_appsec_max_body_size 10m;

    crowdsec_ban_template /etc/nginx/templates/default.html;

    server {
        listen 7822;
        server_name localhost;

        root /usr/share/nginx/html;

        location / {
            # Match hub OpenResty target: 404 when file missing (not catch-all index).
            try_files $uri $uri/ =404;
        }
    }
}
