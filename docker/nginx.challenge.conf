# NGINX config for CrowdSec 1.8 bot-challenge tests (docker/compose.challenge.yml).
load_module /etc/nginx/modules/libngx_http_crowdsec_module.so;

worker_processes 2;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type text/html;

    access_log /var/log/nginx/access.log;

    crowdsec on;
    crowdsec_url http://crowdsec:8080;
    crowdsec_api_key ${CROWDSEC_BOUNCER_KEY};
    crowdsec_poll_interval 2;
    crowdsec_appsec_url http://crowdsec:7422/;
    crowdsec_appsec on;
    crowdsec_appsec_failure_action deny;
    crowdsec_bot_challenge on;

    server {
        listen 8080;
        server_name localhost;

        root /usr/share/nginx/html;

        location / {
            try_files /index.html =404;
        }
    }
}
