[package]
name = "ngx_http_crowdsec_module"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "NGINX dynamic module for CrowdSec integration"
repository = "https://github.com/crowdsecurity/ngx_http_crowdsec_module"
keywords = ["nginx", "crowdsec", "security", "firewall", "waf"]
categories = ["web-programming", "network-programming"]

[lib]
crate-type = ["cdylib"]

[dependencies]
ngx = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.9", features = ["json"] }
parking_lot = "0.12"
once_cell = "1.19"
libc = "0.2"

[features]
default = []
vendored = ["ngx/vendored"]

[profile.release]
lto = true
opt-level = 3
