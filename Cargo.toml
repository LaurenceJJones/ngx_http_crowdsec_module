[package]
name = "ngx_http_crowdsec_module"
version = "0.2.0-rc3"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "NGINX dynamic module for CrowdSec integration"
repository = "https://github.com/LaurenceJJones/ngx_http_crowdsec_module"
keywords = ["nginx", "crowdsec", "security", "firewall", "waf"]
categories = ["web-programming", "network-programming"]

[lib]
crate-type = ["cdylib"]

[dependencies]
ngx = "0.5.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.9", features = ["json"] }
libc = "0.2"

# Captcha session management
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
form_urlencoded = "1.2"
rand = "0.8"

[features]
default = []
vendored = ["ngx/vendored"]

[profile.release]
lto = true
opt-level = 3
